apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-config
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "3000"
  DATABASE_SSL: "false"
  FRONTEND_URL: "http://localhost"
  EXTRA_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:3000,http://localhost:30080"
  ELASTICSEARCH_NODE: "http://elasticsearch:9200"
  ELASTICSEARCH_INDEX: "portfolio-logs"
---
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secret
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
  POSTGRES_DB: "portfolio_db"
  DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/portfolio_db"
  JWT_SECRET: "portfolio_super_secure_jwt_secret_key_32_characters_long!"
  RESEND_API_KEY: "re_placeholder_key"
  RESEND_FROM: "Portfolio Security <onboarding@resend.dev>"
  RAZORPAY_KEY_ID: "rzp_test_placeholder"
  RAZORPAY_KEY_SECRET: "placeholder_secret"
