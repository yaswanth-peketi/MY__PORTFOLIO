version: "3.8"

services:
  # 1. PostgreSQL Database for Users & Auth
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Elasticsearch Cluster
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: portfolio-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=portfolio-cluster
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cat/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 3. Kibana Web Dashboard
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: portfolio-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=1024
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - portfolio-net

  # 4. Node.js Backend API (Connects internally to Postgres & Elasticsearch)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/portfolio_db
      - DATABASE_SSL=false
      - JWT_SECRET=portfolio_super_secure_jwt_secret_key_32_characters_long!
      - RESEND_API_KEY=${RESEND_API_KEY:-re_placeholder_key}
      - RESEND_FROM=${RESEND_FROM:-Portfolio Security <onboarding@resend.dev>}
      - FRONTEND_URL=http://localhost
      - EXTRA_ALLOWED_ORIGINS=http://localhost:80,http://127.0.0.1,http://localhost:3000
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-placeholder_secret}
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=portfolio-logs
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - portfolio-net

  # 5. Frontend & Reverse Proxy (Single Entrypoint at http://localhost)
  frontend:
    image: nginx:alpine
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./payment.js:/usr/share/nginx/html/payment.js:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - portfolio-net

volumes:
  pg_data:
    driver: local
  es_data:
    driver: local

networks:
  portfolio-net:
    driver: bridge
