services:
  - type: web
    name: my-portfolio-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: FRONTEND_URL
        value: https://yaswanth-peketi.github.io
      - key: EXTRA_ALLOWED_ORIGINS
        value: https://yaswanth-peketi.github.io,http://localhost:5500,http://127.0.0.1:5500
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Portfolio Security <onboarding@resend.dev>
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio_db
    user: portfolio_user
