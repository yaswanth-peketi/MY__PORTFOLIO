apiVersion: 1

datasources:
  - name: Portfolio Elasticsearch
    uid: portfolio-es
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: true
    editable: true
    jsonData:
      index: portfolio-logs*
      timeField: "@timestamp"
      esVersion: "8.0.0"
      maxConcurrentShardRequests: 5
      logMessageField: message
      logLevelField: status.keyword
      pplEnabled: true
