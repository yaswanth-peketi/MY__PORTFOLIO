services:
  # 1. PostgreSQL Database for Users & Auth
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: portfolio_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js Backend API (Lightweight Free-Tier Mode without ELK)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/portfolio_db
      - DATABASE_SSL=false
      - JWT_SECRET=${JWT_SECRET:-portfolio_super_secure_jwt_secret_key_32_characters_long!}
      - RESEND_API_KEY=${RESEND_API_KEY:-re_placeholder_key}
      - RESEND_FROM=${RESEND_FROM:-Portfolio Security <onboarding@resend.dev>}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - EXTRA_ALLOWED_ORIGINS=${EXTRA_ALLOWED_ORIGINS:-http://localhost:80,http://127.0.0.1,http://localhost:3000}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-placeholder_secret}
      - ELASTICSEARCH_NODE=${ELASTICSEARCH_NODE:-}
      - ELASTICSEARCH_INDEX=portfolio-logs
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-net

  # 3. Frontend & Reverse Proxy (Single Entrypoint on Port 80)
  frontend:
    image: nginx:alpine
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./payment.js:/usr/share/nginx/html/payment.js:ro
      - ./images:/usr/share/nginx/html/images:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - portfolio-net

volumes:
  pg_data:
    driver: local

networks:
  portfolio-net:
    driver: bridge
