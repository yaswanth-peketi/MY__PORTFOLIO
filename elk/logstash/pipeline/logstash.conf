input {
  tcp {
    port => 5000
    codec => json
  }
  http {
    port => 5044
    codec => json
  }
}

filter {
  # Add received timestamp if missing
  if ![@timestamp] {
    ruby {
      code => "event.set('@timestamp', LogStash::Timestamp.now)"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "portfolio-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
